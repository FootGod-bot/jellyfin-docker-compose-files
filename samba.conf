[global]
        server string = samba
        idmap config * : range = 3000-7999
        security = user
        server min protocol = SMB2

        # disable printing services
        load printers = no
        printing = bsd
        printcap name = /dev/null
        disable spoolss = yes

[movies]
        path = /movies
        comment = Movies for Jellyflix!
        valid users = @smb
        browseable = yes
        writable = yes
        read only = no
        force user = root
        force group = root

[tv-shows]
        path = /tv-shows
        comment = Tv Shows for Jellyflix!
        valid users = @smb
        browseable = yes
        writable = yes
        read only = no
        force user = root
        force group = root

[music]
        path = /music
        comment = Music for Jellyflix!
        valid users = @smb
        browseable = yes
        writable = yes
        read only = no
        force user = root
        force group = root
